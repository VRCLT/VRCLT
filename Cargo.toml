[package]
name = "vrclt"
version = "2.0.0"
edition = "2024"
publish = false

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
base64 = "0.22"
deep-filter-rt = "0.2.0"
earshot = "1.2.2"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
futures-util = { version = "0.3", features = ["sink"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8.9"
ndarray = "0.17"
openvr_sys = "2.1.4"
parking_lot = "0.12"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "multipart", "blocking"] }
rosc = "0.11"
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10.9"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24", "download-binaries", "tls-native"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tray-icon = { version = "0.21", default-features = false }
wasapi = "0.27"
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_UI_Input_KeyboardAndMouse"] }
winreg = "0.55"
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
