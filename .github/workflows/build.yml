# Pull requests: test and build the exe (downloadable from the run's artifacts).
# Pushes to main: test, and when vrclt/__init__.py carries a version with no
# v<version> tag yet, build and publish that GitHub release automatically.
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath vrclt/__init__.py -Raw
          if ($source -notmatch '__version__\s*=\s*"([^"]+)"') { throw "No __version__ in vrclt/__init__.py" }
          $version = $Matches[1]
          $tagged = git ls-remote --tags origin "refs/tags/v$version"
          $release = if ($tagged) { "false" } else { "true" }
          if ($release -eq "true") {
            # a new version needs its notes before it can be merged
            if (-not (Test-Path -LiteralPath "docs/releases/v$version.md")) {
              throw "docs/releases/v$version.md is missing for the new version $version"
            }
            if (-not (Select-String -LiteralPath CHANGELOG.md -SimpleMatch "## [$version]" -Quiet)) {
              throw "CHANGELOG.md has no [$version] section"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          $note = if ($release -eq "true") { "Merging to main releases **v$version**." } else { "v$version is already released; no release on merge." }
          $note >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller==6.21.0

      - name: Test
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\run_tests.py

      - name: Build exe
        if: github.event_name != 'push' || steps.version.outputs.release == 'true'
        shell: pwsh
        run: .\scripts\package_release.ps1 -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push' || steps.version.outputs.release == 'true'
        with:
          name: vrclt-v${{ steps.version.outputs.version }}-windows-x64
          path: release/vrclt-v${{ steps.version.outputs.version }}-windows-x64.exe*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: vrclt-v${{ needs.build.outputs.version }}-windows-x64
          path: release

      - name: Publish release
        run: |
          notes="docs/releases/v$VERSION.md"
          # the notes' "# Title" line names the release
          title="$(sed -n '1s/^# //p' "$notes")"
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "${title:-vrclt v$VERSION}" \
            --notes-file "$notes"
