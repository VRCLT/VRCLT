name: Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read Cargo version and verify release notes
        id: version
        shell: pwsh
        run: |
          $package = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq vrclt
          if ($LASTEXITCODE -ne 0 -or !$package.version) { throw "Missing Cargo version" }
          $version = $package.version
          if (!(Test-Path -LiteralPath "docs/releases/v$version.md") -or !(Select-String -LiteralPath CHANGELOG.md -SimpleMatch "## [$version]" -Quiet)) { throw "Missing release notes for $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/ort.pyke.io
          key: vrclt-msvc-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test and build the Windows app
        shell: pwsh
        run: ./scripts/build_native.ps1 -Test
      - name: Package and verify executable and ZIP
        shell: pwsh
        run: ./scripts/package_release.ps1 -SkipBuild
      - uses: actions/upload-artifact@v7
        with:
          name: vrclt-v${{ steps.version.outputs.version }}-windows-x64
          path: release/vrclt-v${{ steps.version.outputs.version }}-windows-x64.*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vrclt-v${{ needs.build.outputs.version }}-windows-x64
          path: release
      - name: Verify and publish the tested build
        working-directory: release
        run: |
          sha256sum --check *.sha256
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          notes="../docs/releases/$tag.md"
          title="$(sed -n '1s/^# //p' "$notes")"
          gh release create "$tag" ./*.exe ./*.zip ./*.sha256 --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
